
services:
  # ==========================================
  # AI SERVICE
  # ==========================================
  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai

    image: taskpulse-ai-service:latest
    container_name: taskpulse-ai-service
    restart: unless-stopped

    environment:
      PORT: 5001
      DATABASE_URL: ${AI_DATABASE_URL}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
      GROQ_PROMPT_GUARD_MODEL: ${GROQ_PROMPT_GUARD_MODEL:-meta-llama/llama-prompt-guard-2-86m}
      GROQ_SAFEGUARD_MODEL: ${GROQ_SAFEGUARD_MODEL:-openai/gpt-oss-safeguard-20b}

    expose:
      - "5001"

    networks:
      - taskpulse-network

  # ==========================================
  # BACKEND CORE
  # ==========================================
  backend-core:
    build:
      context: ../backend-core
      dockerfile: ../docker/Dockerfile.backend

    image: taskpulse-backend-core:latest
    container_name: taskpulse-backend-core
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001

      DATABASE_URL: ${BACKEND_DATABASE_URL}

      AI_SERVICE_URL: http://ai-service:5001

      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "3001:3001"

    depends_on:
      - ai-service

    networks:
      - taskpulse-network

networks:
  taskpulse-network:
    driver: bridge
